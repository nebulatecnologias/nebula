<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Área de membros para a sua escola</title>
<!-- Um site por mercado (pedido do Shelton a 05/10/2026): /site-mz/ (Moçambique,
     português) e /site-za/ (África do Sul, inglês). Em produção, o Vercel já
     encaminha /site/ pelo país de quem visita (vercel.json); esta página só
     serve quando isso não acontece: escolhe pelo fuso horário do browser. -->
<script>
  (function(){
    var za = false;
    try { za = Intl.DateTimeFormat().resolvedOptions().timeZone === "Africa/Johannesburg"; } catch(e){}
    var q = new URLSearchParams(location.search), m = (q.get("moeda") || q.get("pais") || "").toLowerCase();
    if(m === "zar" || m === "za") za = true;
    if(m === "mzn" || m === "mz") za = false;
    location.replace((za ? "/site-za/" : "/site-mz/") + location.hash);
  })();
</script>
</head>
<body>
<p><a href="/site-mz/">Moçambique · Português</a> · <a href="/site-za/" lang="en">South Africa · English</a></p>
</body>
</html>
