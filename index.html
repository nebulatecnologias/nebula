<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área de Membros</title>
<meta name="description" content="Os seus cursos, aulas, encontros ao vivo e comunidade, num só lugar.">
<!-- Pré-visualização ao partilhar o link (WhatsApp, Facebook, LinkedIn, X).
     As redes só leem endereços absolutos, por isso a imagem aponta ao domínio.
     As redes não correm JavaScript: estas etiquetas são as do domínio principal
     (a Kingdom). Os leitores das redes não chegam a ver este ficheiro: o
     vercel.json manda-os para api/partilha.mjs, que dá as etiquetas da escola
     de cada endereço (W3). O título e o ícone da aba mudam com a marca. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kingdom Academy">
<meta property="og:title" content="Kingdom Academy — Área de Membros">
<meta property="og:description" content="Os seus cursos, aulas, encontros ao vivo e comunidade, num só lugar.">
<meta property="og:url" content="https://membros.kingdomcompny.com/">
<meta property="og:locale" content="pt_PT">
<meta property="og:image" content="https://membros.kingdomcompny.com/img/partilha.png">
<meta property="og:image:secure_url" content="https://membros.kingdomcompny.com/img/partilha.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1080">
<meta property="og:image:height" content="1080">
<meta property="og:image:alt" content="Coroa da Kingdom Academy">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Kingdom Academy — Área de Membros">
<meta name="twitter:description" content="Os seus cursos, aulas, encontros ao vivo e comunidade, num só lugar.">
<meta name="twitter:image" content="https://membros.kingdomcompny.com/img/partilha.png">
<meta name="theme-color" content="#f5f3f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" id="icone-marca" href="img/coroa.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ==================== ARRANQUE ==================== -->
<div id="view-arranque">
  <div class="arranque-caixa">
    <div id="arranque-simbolo"></div>
    <p id="arranque-texto" data-t>A preparar a sua área de membros...</p>
  </div>
</div>

<!-- ==================== VIEW: LOGIN ==================== -->
<div id="view-login" class="hidden">
  <div class="login-shell">
    <aside class="login-brandside">
      <div class="brand-mark"></div>
      <div class="login-quote" id="login-quote">
        <h2></h2>
        <p></p>
      </div>
      <p id="login-rodape"></p>
    </aside>
    <main class="login-formside">
      <div class="login-card">
        <div class="login-idioma" id="login-idioma"></div>
        <h1 data-t>Entrar na sua conta</h1>
        <p class="sub" data-t>Introduza os seus dados para aceder aos seus cursos.</p>
        <form id="form-login" novalidate>
          <div class="field"><label for="input-email">Email</label><input type="email" id="input-email" placeholder="o-seu-email@exemplo.com" data-t-placeholder autocomplete="email" required></div>
          <div class="field"><label for="input-password" data-t>Password</label><input type="password" id="input-password" placeholder="A sua password" data-t-placeholder autocomplete="current-password"></div>
          <div class="form-row-between">
            <label class="checkbox-row"><input type="checkbox" checked> <span data-t>Manter sessão iniciada</span></label>
            <a href="#" class="link-muted" id="btn-esqueci" data-t>Esqueceu-se da password?</a>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-entrar" data-t>Entrar</button>
        </form>
        <p class="login-foot"><span data-t>Ainda não tem conta? A entrada é por convite —</span> <a href="#" id="btn-pedir-acesso" data-t>fale com a sua mentoria</a>.</p>
        <div class="login-aviso hidden" id="login-aviso"></div>
      </div>
    </main>
  </div>
</div>

<!-- ==================== APP SHELL ==================== -->
<div id="app-shell" class="app-shell hidden">
  <div class="backdrop" id="backdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand-mark"></div>
    </div>
    <nav class="sidebar-nav">
      <div id="sidebar-nav-items"></div>
      <div class="nav-item" id="btn-logout" role="button" tabindex="0">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        <span data-t>Sair</span>
      </div>
    </nav>
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <button class="menu-toggle icon-btn" id="btn-menu" aria-label="Abrir menu" data-t-aria><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="brand-mark topbar-marca"></div>
      <div class="topbar-search"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input type="text" placeholder="Pesquisar aulas, módulos..." data-t-placeholder></div>
      <div class="topbar-actions">
        <span id="topbar-cta"></span>
        <button class="icon-btn" id="btn-tema" aria-label="Alternar tema" data-t-aria><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <div class="notif-wrap">
          <button class="icon-btn" id="btn-notif" aria-label="Notificações" data-t-aria><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="badge-dot hidden" id="notif-badge"></span></button>
          <div class="notif-panel hidden" id="notif-panel"></div>
        </div>
        <div class="avatar" id="avatar-iniciais">SD</div>
      </div>
    </header>

    <main class="content">
      <div id="content-dashboard"></div>
      <div id="content-catalogo" class="hidden"></div>
      <div id="content-vitrine" class="hidden"></div>
      <div id="content-curso" class="hidden"></div>
      <div id="content-aula" class="hidden"></div>
      <div id="content-comunidade" class="hidden"></div>
      <div id="content-conquistas" class="hidden"></div>
      <div id="content-calendario" class="hidden"></div>
      <div id="content-certificados" class="hidden"></div>
      <div id="content-definicoes" class="hidden"></div>
      <div id="content-evento" class="hidden"></div>
      <div id="content-oferta" class="hidden"></div>
      <div id="content-destaque" class="hidden"></div>
      <div id="content-admin" class="hidden"></div>
    </main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Navegação principal" data-t-aria></nav>
</div>

<div class="modal-overlay hidden" id="modal-certificado">
  <div class="modal-cert" id="modal-cert-conteudo"></div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>


<script src="vendor/supabase.js"></script>
<script src="js/config.js"></script>

<script src="js/idioma.js"></script>
<script src="js/dados.js"></script>
<script src="js/nucleo.js"></script>
<script src="js/componentes.js"></script>
<script src="js/aluno.js"></script>
<script src="js/onboarding.js"></script>
<script src="js/paginas.js"></script>
<script src="js/admin.js"></script>
<script src="js/admin-conteudos.js"></script>

<script src="js/admin-migracao.js"></script>

<script src="js/admin-relatorios.js"></script>
<script src="js/integracoes-ui.js"></script>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
